<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sieve Create Preset Mockup</title>
  <style>
    * { box-sizing: border-box; }
    :root { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color: #0b0b0b; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 18px; background: #e5e5e2; }
    button, input, [contenteditable] { color: inherit; font: inherit; }
    button { cursor: pointer; }
    button:active { transform: translateY(1px); }
    .window { width: min(1180px, calc(100vw - 36px)); height: min(720px, calc(100vh - 36px)); overflow: hidden; border: 1px solid #777; border-radius: 8px; background: #f8f8f6; box-shadow: 0 14px 38px rgba(0,0,0,.16); }
    .titlebar { display: flex; height: 30px; align-items: center; justify-content: space-between; padding: 0 10px; border-bottom: 1px solid #dededb; background: #f5f5f3; font-size: 12px; }
    .close { font-size: 17px; font-weight: 300; }
    .app { position: relative; height: calc(100% - 30px); overflow: auto; background-color: #f8f8f6; background-image: radial-gradient(rgba(0,0,0,.2) .7px,transparent .8px); background-size: 9px 9px; }
    .head { position: sticky; top: 0; z-index: 12; display: flex; min-height: 58px; align-items: center; justify-content: space-between; padding: 9px 20px; border-bottom: 1.5px solid #111; background: rgba(248,248,246,.97); backdrop-filter: blur(8px); }
    .head-left { display: flex; align-items: center; gap: 12px; }
    .head-actions { display: flex; align-items: center; gap: 10px; }
    .head-count { color: #666; font-size: 9px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
    .back { display: grid; width: 32px; height: 32px; place-items: center; padding: 0; border: 1.5px solid #111; border-radius: 50%; background: #fff; font-size: 16px; transition: background .12s ease,color .12s ease; }
    .back:hover { background: #111; color: #fff; }
    h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
    .meta { margin-top: 2px; color: #666; font-size: 8px; letter-spacing: .1em; text-transform: uppercase; }
    .save { height: 34px; padding: 0 14px; border: 1.5px solid #111; border-radius: 999px; background: #111; color: #fff; font-size: 10px; font-weight: 900; transition: transform .12s ease,box-shadow .12s ease; }
    .save:hover { transform: translate(-1px,-1px); box-shadow: 2px 2px 0 #888; }
    .identity { display: flex; min-height: 188px; align-items: center; justify-content: center; padding: 12px 20px; border-bottom: 1.5px solid #111; background: rgba(248,248,246,.82); }
    .icons { display: grid; grid-template-columns: repeat(6,34px); gap: 6px; }
    .icon-choice { display: grid; width: 34px; height: 34px; min-width: 34px; place-items: center; padding: 6px; border: 1px solid transparent; border-radius: 7px; background: transparent; transition: transform .1s ease,background .1s ease; }
    .icon-choice:hover { border-color: #111; background: #fff; }
    .icon-choice.selected { border-color: #111; background: #111; }
    .icon-choice img { width: 100%; height: 100%; object-fit: contain; }
    .icon-choice.selected img { filter: invert(1); }
    .preview-wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .preview { position: relative; display: flex; width: 152px; height: 152px; flex-direction: column; justify-content: space-between; padding: 10px; overflow: hidden; border: 1.5px solid #111; border-radius: 9px; background: #f8f8f6; box-shadow: 3px 3px 0 #111; transition: transform .14s ease,box-shadow .14s ease; }
    .preview:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 #111; }
    .preview > span { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
    .preview-icon-button { display: grid; width: 34px; height: 34px; place-items: center; margin-left: -3px; padding: 3px; border: 1px solid transparent; border-radius: 6px; background: transparent; }
    .preview-icon-button:hover,.preview-icon-button[aria-expanded="true"] { border-color: #111; background: #fff; }
    .preview img { width: 28px; height: 28px; object-fit: contain; }
    .preview strong { overflow: hidden; font-size: 16px; line-height: 1.05; text-overflow: ellipsis; white-space: nowrap; }
    .preview em { overflow: hidden; color: #666; font-size: 10px; font-style: normal; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
    .preview [contenteditable="true"] { max-width: 100%; border-bottom: 1px dashed transparent; cursor: text; outline: none; }
    .preview [contenteditable="true"]:hover { border-bottom-color: #888; }
    .preview [contenteditable="true"]:focus { border-bottom-color: #111; text-overflow: clip; }
    .icon-popover { position: absolute; top: 20px; left: calc(100% + 14px); z-index: 20; padding: 9px; border: 1.5px solid #111; border-radius: 9px; background: #fff; box-shadow: 4px 4px 0 #111; }
    .tools { position: sticky; top: 58px; z-index: 10; display: flex; align-items: center; gap: 8px; padding: 8px 20px; border-bottom: 1px solid #111; background: rgba(248,248,246,.97); backdrop-filter: blur(8px); }
    .search { min-width: 0; height: 34px; flex: 1; padding: 0 12px; border: 1.5px solid #111; border-radius: 999px; background: #fff; outline: none; }
    .search:focus { box-shadow: 0 0 0 2px #bbb; }
    .tool { height: 30px; padding: 0 10px; border: 1.5px solid #111; border-radius: 999px; background: #fff; font-size: 9px; font-weight: 900; transition: background .12s ease,color .12s ease; }
    .tool:hover { background: #111; color: #fff; }
    .count { min-width: 76px; color: #555; font-size: 9px; font-weight: 800; text-align: right; text-transform: uppercase; }
    .plugins { display: grid; grid-template-columns: repeat(10,minmax(0,1fr)); gap: 8px; padding: 13px 20px 24px; }
    .plugin { position: relative; display: flex; min-width: 0; aspect-ratio: 1; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px 6px 25px; border: 1.5px solid #111; border-radius: 8px; background: rgba(255,255,255,.86); transition: transform .1s ease,box-shadow .1s ease,background .15s ease,color .15s ease; }
    .plugin:hover { transform: translate(-1px,-1px); box-shadow: 2px 2px 0 #111; }
    .plugin:focus-visible { outline: 3px solid #999; outline-offset: 2px; }
    .plugin.selected { background: #111; color: #fff; }
    .plugin-icon { display: grid; width: 31px; height: 31px; place-items: center; border: 1px solid currentColor; border-radius: 6px; background: #fff; color: #111; font-size: 9px; font-weight: 900; }
    .plugin-name { width: 100%; overflow: hidden; font-size: 9px; font-weight: 850; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    .plugin-status { position: absolute; right: 4px; bottom: 7px; left: 4px; overflow: hidden; color: #777; font-size: 8px; font-weight: 400; letter-spacing: .02em; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    .plugin.selected .plugin-status { color: #d7d7d2; }
    .hidden { display: none; }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior: auto!important; transition-duration: .01ms!important; } }
    @media(max-width:1050px) { .plugins { grid-template-columns: repeat(8,minmax(0,1fr)); } }
    @media(max-width:760px) { .plugins { grid-template-columns:repeat(5,minmax(0,1fr)); }.icon-popover { top: calc(100% + 8px); left: 50%; transform: translateX(-50%); } }
  </style>
</head>
<body>
  <section class="window">
    <header class="titlebar"><span>Sieve</span><span class="close">&times;</span></header>
    <main class="app">
      <header class="head">
        <div class="head-left"><button class="back" title="Back">&#8592;</button><div><h1>Create preset</h1><div class="meta">Preset editor</div></div></div>
        <div class="head-actions"><span id="headCount" class="head-count">7 plugins</span><button class="save">Save preset</button></div>
      </header>
      <section class="identity">
        <div id="previewWrap" class="preview-wrap">
          <article class="preview">
            <span>Preset</span>
            <button id="previewIconButton" class="preview-icon-button" type="button" aria-label="Choose preset icon" aria-expanded="false"><img id="previewIcon" alt=""></button>
            <strong id="previewName" contenteditable="true" spellcheck="false">Facade study</strong>
            <em id="previewDescription" contenteditable="true" spellcheck="false">Paneling, analysis and export</em>
            <em id="previewCount">7 plugins</em>
          </article>
          <div id="iconPopover" class="icon-popover hidden"><div id="icons" class="icons"></div></div>
        </div>
      </section>
      <section class="tools">
        <input id="search" class="search" placeholder="Search plugins">
        <button id="selectAll" class="tool">Select all</button>
        <button id="clearAll" class="tool">Clear</button>
        <span id="count" class="count">7 selected</span>
      </section>
      <section id="plugins" class="plugins"></section>
    </main>
  </section>
  <script>
    const iconRoot = '../EmbeddedResources/streamline-core-solid---free--500x500-PNG/';
    const iconNames = ['Coffee-Mug--Streamline-Core.png','Burger--Streamline-Core.png','Donut--Streamline-Core.png','Cherries--Streamline-Core.png','Lemon-Fruit-Seasoning--Streamline-Core.png','Cake-Slice--Streamline-Core.png','Popcorn--Streamline-Core.png','Cocktail--Streamline-Core.png','Strawberry--Streamline-Core.png','Tea-Cup--Streamline-Core.png','Wine--Streamline-Core.png','Cheese--Streamline-Core.png'];
    const pluginNames = ['Ladybug','Honeybee','Weaverbird','Kangaroo','LunchBox','Human','Elefront','Pufferfish','Anemone','MeshPlus','Wasp','Karamba','ShapeDiver','Metahopper','TreeFrog','Dendro','Hops','Galapagos','Wallacei','OpenNest','Millipede','TT Toolbox','Crystallon','Ivy','Bifocals','Gismo','Cocoon','Parakeet','PanelingTools','Rhino.Inside','Octopus','Opossum','Quelea','Nudibranch','FlexHopper','Decodes','Fox','Termite','PhysX','Monoceros','Mosquito','Butterfly','Hoopsnake','Sasquatch','Squid','Sparrow','Pancake','Ameba','Kiwi3D','Scan&Solve'];
    const icons = document.getElementById('icons');
    const previewIcon = document.getElementById('previewIcon');
    const previewIconButton = document.getElementById('previewIconButton');
    const iconPopover = document.getElementById('iconPopover');
    iconNames.forEach((name,index) => {
      const button = document.createElement('button');
      button.className = 'icon-choice' + (index === 0 ? ' selected' : '');
      button.title = name.replace('--Streamline-Core.png','').replaceAll('-',' ');
      button.innerHTML = '<img src="' + iconRoot + name + '" alt="">';
      button.addEventListener('click', () => {
        document.querySelectorAll('.icon-choice').forEach(item => item.classList.remove('selected'));
        button.classList.add('selected');
        previewIcon.src = iconRoot + name;
        iconPopover.classList.add('hidden');
        previewIconButton.setAttribute('aria-expanded','false');
      });
      icons.appendChild(button);
    });
    previewIcon.src = iconRoot + iconNames[0];
    previewIconButton.addEventListener('click', event => {
      event.stopPropagation();
      const open = iconPopover.classList.toggle('hidden');
      previewIconButton.setAttribute('aria-expanded', open ? 'false' : 'true');
    });
    document.addEventListener('click', event => {
      if (!document.getElementById('previewWrap').contains(event.target)) {
        iconPopover.classList.add('hidden');
        previewIconButton.setAttribute('aria-expanded','false');
      }
    });
    const plugins = document.getElementById('plugins');
    pluginNames.forEach((name,index) => {
      const button = document.createElement('button');
      button.className = 'plugin' + (index < 7 ? ' selected' : '');
      button.type = 'button';
      button.dataset.name = name.toLowerCase();
      button.setAttribute('aria-pressed', index < 7 ? 'true' : 'false');
      button.title = name;
      button.innerHTML = '<span class="plugin-icon">' + name.replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase() + '</span><span class="plugin-name">' + name + '</span><span class="plugin-status">' + (index < 7 ? '[enabled]' : '[disabled]') + '</span>';
      button.addEventListener('click', () => {
        setCardState(button, !button.classList.contains('selected'));
        updateCount();
      });
      plugins.appendChild(button);
    });
    function setCardState(card, enabled) {
      card.classList.toggle('selected', enabled);
      card.setAttribute('aria-pressed', enabled ? 'true' : 'false');
      card.querySelector('.plugin-status').textContent = enabled ? '[enabled]' : '[disabled]';
    }
    function updateCount() {
      const selected = document.querySelectorAll('.plugin.selected').length;
      document.getElementById('count').textContent = selected + ' selected';
      document.getElementById('headCount').textContent = selected + (selected === 1 ? ' plugin' : ' plugins');
      document.getElementById('previewCount').textContent = selected + (selected === 1 ? ' plugin' : ' plugins');
    }
    [
      [document.getElementById('previewName'), 'Untitled preset'],
      [document.getElementById('previewDescription'), 'No description']
    ].forEach(([element,fallback]) => {
      element.addEventListener('keydown', event => {
        if (event.key === 'Enter') { event.preventDefault(); element.blur(); }
      });
      element.addEventListener('blur', () => {
        if (!element.textContent.trim()) element.textContent = fallback;
      });
    });
    document.getElementById('search').addEventListener('input', event => {
      const query = event.target.value.trim().toLowerCase();
      document.querySelectorAll('.plugin').forEach(card => { card.classList.toggle('hidden', query && !card.dataset.name.includes(query)); });
    });
    document.getElementById('selectAll').addEventListener('click', () => { document.querySelectorAll('.plugin:not(.hidden)').forEach(card => setCardState(card, true)); updateCount(); });
    document.getElementById('clearAll').addEventListener('click', () => { document.querySelectorAll('.plugin:not(.hidden)').forEach(card => setCardState(card, false)); updateCount(); });
  </script>
</body>
</html>
